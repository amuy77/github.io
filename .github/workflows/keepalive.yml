name: Supabase keepalive

# 無料プランのプロジェクトは 7 日間 DB 活動が無いと自動停止するので、毎日 1 回だけ軽く叩く。
# .env の値は公開前提（RLS で守られている）。未設定なら何もしない。
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ping REST API
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2-)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured; skip"; exit 0; fi
          curl -fsS "$URL/rest/v1/genres?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "status %{http_code}\n"
