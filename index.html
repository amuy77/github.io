<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Review Inbox</title>
  <meta name="description" content="Airbnb と Booking.com の通知メールを自動で仕分けし、レビュー対応の期限と返信を管理する PWA">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Review Inbox</h1>
    <div class="topbar-actions">
      <button id="btn-sync" class="btn btn-primary" type="button">同期</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="メインタブ">
    <button class="tab is-active" data-tab="reviews" type="button"><span class="tab-icon">★</span>レビュー<span id="badge-reviews" class="tab-badge" hidden></span></button>
    <button class="tab" data-tab="inbox" type="button"><span class="tab-icon">✉</span>受信箱<span id="badge-inbox" class="tab-badge" hidden></span></button>
    <button class="tab" data-tab="add" type="button"><span class="tab-icon">＋</span>追加</button>
    <button class="tab" data-tab="settings" type="button"><span class="tab-icon">⚙</span>設定</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
